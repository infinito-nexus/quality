name: update

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  flake-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0

      - name: Move every versioned registry input of flake.nix to its newest stable release
        run: nix shell --inputs-from . nixpkgs#python3 nixpkgs#prefetch-npm-deps --command python3 .github/update/inputs.py flake.nix

      - name: Update every input of flake.lock
        run: nix flake update

      - name: Pin the newest ORT release by its digest
        run: python3 .github/ort/pin.py update .github/ort/image

      - name: Run the tests on the updated tools before any pull request exists
        run: nix develop --command make test-unit test-integration test-service

      - name: Hand only the updated pins to the pull request job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flake-lock
          path: |
            flake.nix
            flake.lock
            .github/ort/image
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  pull-request:
    needs: flake-lock
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the pins the update job tested
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flake-lock
          path: ${{ runner.temp }}/flake-lock

      - name: Take over flake.nix, flake.lock and the ORT image pin only
        run: |
          cp -- "$RUNNER_TEMP/flake-lock/flake.nix" "$RUNNER_TEMP/flake-lock/flake.lock" .
          cp -- "$RUNNER_TEMP/flake-lock/.github/ort/image" .github/ort/image

      - name: Open or refresh the update pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: update/flake-lock
          add-paths: flake.lock,flake.nix,.github/ort/image
          commit-message: "chore(deps): update the pinned tools"
          title: "chore(deps): update the pinned tools"
          body: ".github/update/inputs.py moved the versioned registry inputs of flake.nix, nix flake update bumped flake.lock and .github/ort/pin.py pinned the newest ORT release by digest in .github/ort/image; make test-unit test-integration test-service passed on these pins in the read-only update job before this pull request was opened."
          delete-branch: true
