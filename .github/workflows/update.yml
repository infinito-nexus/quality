name: update

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  flake-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - name: Update every input of flake.lock
        run: nix flake update

      - name: Pin the newest ORT release by its digest
        run: python3 .github/ort/pin.py update .github/ort/image

      - name: Run the tests on the updated tools before any pull request exists
        run: nix develop --command make test-unit test-integration test-service

      - name: Open or refresh the update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: update/flake-lock
          add-paths: |
            flake.lock
            .github/ort/image
          commit-message: "chore(deps): update the pinned tools"
          title: "chore(deps): update the pinned tools"
          body: "nix flake update bumped flake.lock and .github/ort/pin.py pinned the newest ORT release by digest in .github/ort/image; make test-unit test-integration test-service passed on these pins in the update job before this pull request was opened."
          delete-branch: true
