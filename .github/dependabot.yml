version: 2

updates:
  - package-ecosystem: "pip"
    directories:
      - "**/*"
    schedule:
      interval: "daily"
      time: "00:00"
    rebase-strategy: "auto"

  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "daily"
      time: "00:00"

  - package-ecosystem: "docker"
    directories:
      - "**/*"
    schedule:
      interval: "daily"
      time: "00:00"

  - package-ecosystem: "docker-compose"
    directories:
      - "**/*"
    exclude-paths:
      - "*.j2"
      - "**/*.j2"
    schedule:
      interval: "daily"
      time: "00:00"
