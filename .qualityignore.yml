- rule: clean.folder-items
  paths: ["."]
  reason: the root holds the runner package and, by requirement 002 decision 2, the role under ansible/ and the service under service/
- rule: clean.folder-items
  paths: ["ansible/roles/web-app-cst-quality-check/meta"]
  reason: Infinito.Nexus core fixes one file per topic under a role's meta/ (utils/roles/mapping.py in core), so the folder cannot be split
- rule: coding.implicit-namespace
  paths:
    - ansible/roles/web-app-cst-quality-check/files/python/script.py
    - service/verify/extra_vars.py
    - .github/update/inputs.py
    - .github/ort/pin.py
  reason: standalone scripts run by path; sys-service copies script.py alone, so a package file next to it would never ship, the update job runs inputs.py by path, and the ort and update workflows run .github/ort/pin.py by path
- rule: clean.folder-items
  paths: ["src/quality"]
  reason: requirement 001 decision 24 adds db.py as the thirteenth item of the runner package, its Distribution criteria add doctor.py for `quality doctor`, and kinds.py, waivers.py and environment.py keep ruledata.py and modes.py under the file line limit, requirement 004 adds the legal/ subpackage and requirement 005 the architecture/ subpackage of the layer tool adapters, since src/quality/adapters is past the item limit already; moving modules into subpackages would change every import and is a refactor of its own
- rule: clean.clones
  paths:
    - tests/integration/hard/test_code.py
    - tests/integration/hard/test_scanner.py
    - tests/integration/hard/test_secret.py
    - tests/integration/test_modes.py
  reason: the secret-scanner tests spell out each staged, base and history scenario in full, as main wrote them before the deep tier ran jscpd; folding them is a refactor of its own
- rule: clean.clones
  paths: ["tests/service/test_web.py"]
  reason: each rate-limit test spells out its own request sequence, so the repeated client setup and first two submissions keep every test readable on its own
- rule: legal.external-request
  paths: ["tests/integration/rules/test_legal.py"]
  reason: the fixtures of legal.external-request write the third-party web font link the rule must find into a template of the fixture repository; the test file itself requests nothing
- rule: legal.foreign-origin
  paths: ["tests/integration/rules/test_legal.py"]
  reason: the legal fixtures write the GPL texts and headers the legal rules must find into files of the fixture repository; the test file itself holds no foreign code
- rule: legal.foreign-origin
  paths: ["service/web/quality_web/templates/notices.html.j2"]
  reason: the notices page names the licence of every bundled package as its attribution; it carries no code under those licences
