ruff:
  timeout: 120
  exit_codes: [0, 1]
  target_version: py314
  loads:
    - pyproject.toml
    - ruff.toml
    - .ruff.toml
rg:
  timeout: 60
  exit_codes: [0, 1]
  templates: true
  reports_lines: true
  loads:
    - .ignore
    - .rgignore
    - .ripgreprc
    - .gitignore
shellcheck:
  timeout: 120
  exit_codes: [0, 1]
  loads:
    - .shellcheckrc
actionlint:
  timeout: 60
  exit_codes: [0, 1]
  loads:
    - .github/actionlint.yaml
    - .github/actionlint.yml
    - actionlint.yaml
ast-grep:
  timeout: 120
  exit_codes: [0, 1]
  stderr_fails: true
  rule_dir: ast-grep
  loads:
    - sgconfig.yml
    - sgconfig.yaml
    - .ignore
    - .gitignore
lizard:
  timeout: 300
  exit_codes: [0]
  stderr_fails: true
  loads:
    - whitelizard.txt
    - lizard_ext/__init__.py
    - lizard_languages/__init__.py
gitleaks:
  timeout: 300
  exit_codes: [0]
  config: |
    [extend]
    useDefault = true
  loads:
    - .gitleaks.toml
    - .gitleaksignore
hadolint:
  timeout: 120
  exit_codes: [0]
  stderr_fails: true
  config: |
    ignored: []
  loads:
    - .hadolint.yaml
    - .hadolint.yml
semgrep:
  timeout: 600
  exit_codes: [0]
  configs:
    javascript: semgrep/javascript.yml
    typescript: semgrep/javascript.yml
    tsx: semgrep/javascript.yml
  loads:
    - .semgrepignore
    - .semgrep.yml
    - .semgrep.yaml
    - .semgrep/settings.yml
jscpd:
  timeout: 600
  exit_codes: [0]
  single_command: true
  whole_snapshot: true
  max_size: 1gb
  loads:
    - .jscpd.json
    - package.json
trivy:
  timeout: 300
  exit_codes: [0]
  parse_errors: [Walk error, Analysis error, Failed to parse]
  database: true
  db_repository: ghcr.io/aquasecurity/trivy-db:2
  update_timeout: 1800
  loads:
    - trivy.yaml
    - .trivyignore
    - .trivyignore.yaml
    - trivy-secret.yaml
osv-scanner:
  timeout: 300
  exit_codes: [0, 1]
  database: true
  ecosystems: [PyPI, npm, Go, crates.io, RubyGems, Packagist]
  offline_url: https://osv-vulnerabilities.storage.googleapis.com/{ecosystem}/all.zip
  offline_path: osv-scalibr/{ecosystem}/all.zip
  update_timeout: 1800
  loads:
    - osv-scanner.toml
