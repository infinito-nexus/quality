- id: clean.file-lines
  severity: medium
  summary: File exceeds the line limit
  metric:
    limit: 500
  exclude:
    - /tests/
    - "*.lock"
    - package-lock.json
    - locales/
    - generated/
  enforcer:
    code:
      builtin: file-lines
- id: clean.folder-items
  severity: medium
  summary: Folder exceeds the direct item limit
  metric:
    limit: 12
  enforcer: folder-items
- id: clean.prefix-groups
  severity: medium
  summary: Sibling files share a name prefix; move them into a folder
  metric:
    limit: 1
    exempt: [test]
  enforcer: prefix-groups
- id: clean.inline-script
  severity: medium
  summary: Inline script exceeds the logical line limit
  metric:
    limit: 11
  enforcer:
    workflow:
      builtin: inline-script
- id: clean.complexity
  severity: medium
  summary: Function exceeds the cyclomatic complexity limit
  metric:
    limit: 10
  enforcer:
    python:
      tool: lizard
      field: ccn
- id: clean.function-length
  severity: medium
  summary: Function exceeds the length limit
  metric:
    limit: 50
  enforcer:
    python:
      tool: lizard
      field: nloc
- id: clean.parameters
  severity: medium
  summary: Function exceeds the parameter limit
  metric:
    limit: 5
  enforcer:
    python:
      tool: lizard
      field: parameters
- id: clean.tool-pragma
  severity: medium
  summary: Tool pragma added; use a nocheck comment with a reason
  enforcer:
    code: &tool-pragma
      tool: rg
      comment_only: true
      pattern: '(?i)(#|//)\s*((ruff:\s*|flake8:\s*)?noqa\b|ruff:\s*disable\b|shellcheck\s+disable|ast-grep-ignore|hadolint\s+(global\s+)?(ignore|shell)\s*=)|#\s*lizard\s+forgive|gitleaks:allow'
    dockerfile: *tool-pragma
- id: clean.clones
  severity: medium
  summary: Duplicated code block
  tier: deep
  enforcer:
    code:
      tool: jscpd
      min_tokens: 50
      min_lines: 1
