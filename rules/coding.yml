- id: coding.unused-import
  severity: medium
  summary: Imported name is never used
  enforcer:
    python:
      tool: ruff
      codes: [F401]
- id: coding.undefined-name
  severity: high
  summary: Name is used but never defined
  enforcer:
    python:
      tool: ruff
      codes: [F821]
- id: coding.import-order
  severity: low
  summary: Imports are not sorted
  enforcer:
    python:
      tool: ruff
      codes: [I001]
- id: coding.implicit-namespace
  severity: low
  summary: Python file sits in a package without __init__.py
  file_level: true
  enforcer:
    python:
      tool: ruff
      codes: [INP001]
- id: coding.syntax-error
  severity: high
  summary: File does not parse or decode
  enforcer:
    python:
      tool: ruff
      codes: [E902]
      always_reported: [invalid-syntax]
    json: {builtin: json-syntax, parses: true}
    yaml: {builtin: yaml-syntax, parses: true}
    shell: &decodes {builtin: utf-8, parses: true}
    javascript: *decodes
    typescript: *decodes
    tsx: *decodes
    java: *decodes
    kotlin: *decodes
    csharp: *decodes
    rust: *decodes
    go: *decodes
    ruby: *decodes
    php: *decodes
    lua: *decodes
    c: *decodes
    cpp: *decodes
    html: *decodes
    css: *decodes
    nix: *decodes
    hcl: *decodes
- id: coding.parse-incomplete
  severity: high
  summary: Changed file the parser cannot read in full, so structural rules miss part of it; name a grammar gap in a nocheck
  changed_only: true
  enforcer:
    javascript: {tool: ast-grep, language: javascript}
    typescript: {tool: ast-grep, language: typescript}
    tsx: {tool: ast-grep, language: tsx}
    java: {tool: ast-grep, language: java}
    kotlin: {tool: ast-grep, language: kotlin}
    csharp: {tool: ast-grep, language: csharp}
    rust: {tool: ast-grep, language: rust}
    go: {tool: ast-grep, language: go}
    ruby: {tool: ast-grep, language: ruby}
    php: {tool: ast-grep, language: php}
    lua: {tool: ast-grep, language: lua}
    c: {tool: ast-grep, language: c}
    cpp: {tool: ast-grep, language: cpp}
    html: {tool: ast-grep, language: html}
    css: {tool: ast-grep, language: css}
    nix: {tool: ast-grep, language: nix}
    hcl: {tool: ast-grep, language: hcl}
- id: coding.shell-lint
  severity: medium
  summary: Shell script violates a shellcheck check
  enforcer:
    shell:
      tool: shellcheck
- id: coding.workflow-lint
  severity: medium
  summary: GitHub workflow violates an actionlint check
  enforcer:
    workflow:
      tool: actionlint
- id: coding.structural
  severity: medium
  summary: Per-language structural rule matched
  lens: fail fast
  architecture: 10
  enforcer:
    python: {tool: ast-grep, language: python}
    shell: {tool: ast-grep, language: bash}
    javascript: {tool: ast-grep, language: javascript}
    typescript: {tool: ast-grep, language: typescript}
    tsx: {tool: ast-grep, language: tsx}
    java: {tool: ast-grep, language: java}
    kotlin: {tool: ast-grep, language: kotlin}
    rust: {tool: ast-grep, language: rust}
    go: {tool: ast-grep, language: go}
    ruby: {tool: ast-grep, language: ruby}
    php: {tool: ast-grep, language: php}
    lua: {tool: ast-grep, language: lua}
    c: {tool: ast-grep, language: c}
    cpp: {tool: ast-grep, language: cpp}
    yaml: {tool: ast-grep, language: yaml}
    json: {tool: ast-grep, language: json}
    html: {tool: ast-grep, language: html}
    css: {tool: ast-grep, language: css}
    nix: {tool: ast-grep, language: nix}
- id: coding.conflict-marker
  severity: high
  summary: Unresolved merge conflict marker
  enforcer:
    code: &conflict-marker
      tool: rg
      pattern: '^(?:<{7}|>{7}|\|{7})(?: |$)'
    yaml: *conflict-marker
    json: *conflict-marker
    markdown: *conflict-marker
    html: *conflict-marker
    css: *conflict-marker
    xml: *conflict-marker
    sql: *conflict-marker
    toml: *conflict-marker
    ini: *conflict-marker
    conf: *conflict-marker
    env: *conflict-marker
    make: *conflict-marker
    dockerfile: *conflict-marker
    nginx: *conflict-marker
    systemd: *conflict-marker
    tex: *conflict-marker
    nix: *conflict-marker
    hcl: *conflict-marker
    jinja: *conflict-marker
    workflow: *conflict-marker
- id: coding.dockerfile
  severity: medium
  summary: Dockerfile violates a hadolint check
  exclude:
    - "*.j2"
    - "*.jinja"
    - "*.jinja2"
  enforcer:
    dockerfile:
      tool: hadolint
- id: coding.empty-except
  severity: medium
  summary: Exception handler that only passes or continues; handle the error or let it raise
  enforcer:
    python:
      tool: ruff
      codes: [S110, S112]
- id: coding.shell-or-true
  severity: medium
  summary: Command failure silenced with || true; handle the failure or let it stop the script
  enforcer:
    shell:
      tool: rg
      pcre2: true
      pattern: '^(?![ \t]*#).*\|\|[ \t]*(?:true|:)[ \t]*(?:$|[;)&|#])'
- id: coding.workflow-runner-latest
  severity: medium
  summary: Workflow runs on a moving -latest runner image; pin the image version
  enforcer:
    workflow:
      tool: rg
      pattern: '^[ \t]*runs-on:.*-latest\b'
- id: coding.workflow-timeout
  severity: low
  summary: Job timeout above 355 minutes leaves no headroom under GitHub's 360 minute limit
  enforcer:
    workflow:
      tool: rg
      pattern: '^[ \t]*timeout-minutes:[ \t]*(?:35[6-9]|3[6-9][0-9]|[4-9][0-9]{2}|[0-9]{4,})\b'
- id: coding.dockerfile-syntax-directive
  severity: low
  summary: Dockerfile syntax directive pulls a frontend image at build time; use the builder's own parser
  enforcer:
    dockerfile:
      tool: rg
      pattern: '(?i)^#[ \t]*syntax[ \t]*='
- id: coding.distro-codename-tag
  severity: low
  summary: Image tag names a Debian codename that moves with every point release; pin the version
  enforcer:
    dockerfile: &codename-tag
      tool: rg
      pattern: '(?i)(?:^[ \t]*FROM[ \t]+|\bimage:[ \t]*["'']?)[^\s"'':]+:[^\s"'']*\b(?:buster|bullseye|bookworm|trixie)\b'
    yaml: *codename-tag
    workflow: *codename-tag
- id: coding.timeout-foreground
  severity: low
  summary: timeout without --foreground moves the child out of the caller's process group, so the caller's terminal and signals miss it
  enforcer:
    python:
      tool: rg
      pcre2: true
      pattern: '(?<![\w\])}"''])\[[ \t]*["'']timeout["''](?![^\]]*["'']--foreground["''])'
