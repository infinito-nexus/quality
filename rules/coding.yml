- id: coding.unused-import
  severity: medium
  summary: Imported name is never used
  enforcer:
    python:
      tool: ruff
      codes: [F401]
- id: coding.undefined-name
  severity: high
  summary: Name is used but never defined
  enforcer:
    python:
      tool: ruff
      codes: [F821]
- id: coding.import-order
  severity: low
  summary: Imports are not sorted
  enforcer:
    python:
      tool: ruff
      codes: [I001]
- id: coding.implicit-namespace
  severity: low
  summary: Python file sits in a package without __init__.py
  file_level: true
  enforcer:
    python:
      tool: ruff
      codes: [INP001]
- id: coding.syntax-error
  severity: high
  summary: File does not parse or decode
  enforcer:
    python:
      tool: ruff
      codes: [E902]
      always_reported: [invalid-syntax]
    json: {builtin: json-syntax, parses: true}
    yaml: {builtin: yaml-syntax, parses: true}
    shell: &decodes {builtin: utf-8, parses: true}
    javascript: *decodes
    typescript: *decodes
    tsx: *decodes
    java: *decodes
    kotlin: *decodes
    csharp: *decodes
    rust: *decodes
    go: *decodes
    ruby: *decodes
    php: *decodes
    lua: *decodes
    c: *decodes
    cpp: *decodes
    html: *decodes
    css: *decodes
    nix: *decodes
    hcl: *decodes
- id: coding.parse-incomplete
  severity: high
  summary: Changed file the parser cannot read in full, so structural rules miss part of it; name a grammar gap in a nocheck
  changed_only: true
  enforcer:
    javascript: {tool: ast-grep, language: javascript}
    typescript: {tool: ast-grep, language: typescript}
    tsx: {tool: ast-grep, language: tsx}
    java: {tool: ast-grep, language: java}
    kotlin: {tool: ast-grep, language: kotlin}
    csharp: {tool: ast-grep, language: csharp}
    rust: {tool: ast-grep, language: rust}
    go: {tool: ast-grep, language: go}
    ruby: {tool: ast-grep, language: ruby}
    php: {tool: ast-grep, language: php}
    lua: {tool: ast-grep, language: lua}
    c: {tool: ast-grep, language: c}
    cpp: {tool: ast-grep, language: cpp}
    html: {tool: ast-grep, language: html}
    css: {tool: ast-grep, language: css}
    nix: {tool: ast-grep, language: nix}
    hcl: {tool: ast-grep, language: hcl}
- id: coding.shell-lint
  severity: medium
  summary: Shell script violates a shellcheck check
  enforcer:
    shell:
      tool: shellcheck
- id: coding.workflow-lint
  severity: medium
  summary: GitHub workflow violates an actionlint check
  enforcer:
    workflow:
      tool: actionlint
- id: coding.structural
  severity: medium
  summary: Per-language structural rule matched
  enforcer:
    python: {tool: ast-grep, language: python}
    shell: {tool: ast-grep, language: bash}
    javascript: {tool: ast-grep, language: javascript}
    typescript: {tool: ast-grep, language: typescript}
    tsx: {tool: ast-grep, language: tsx}
    java: {tool: ast-grep, language: java}
    kotlin: {tool: ast-grep, language: kotlin}
    rust: {tool: ast-grep, language: rust}
    go: {tool: ast-grep, language: go}
    ruby: {tool: ast-grep, language: ruby}
    php: {tool: ast-grep, language: php}
    lua: {tool: ast-grep, language: lua}
    c: {tool: ast-grep, language: c}
    cpp: {tool: ast-grep, language: cpp}
    yaml: {tool: ast-grep, language: yaml}
    json: {tool: ast-grep, language: json}
    html: {tool: ast-grep, language: html}
    css: {tool: ast-grep, language: css}
    nix: {tool: ast-grep, language: nix}
- id: coding.conflict-marker
  severity: high
  summary: Unresolved merge conflict marker
  enforcer:
    code: &conflict-marker
      tool: rg
      pattern: '^(?:<{7}|>{7}|\|{7})(?: |$)'
    yaml: *conflict-marker
    json: *conflict-marker
    markdown: *conflict-marker
    html: *conflict-marker
    css: *conflict-marker
    xml: *conflict-marker
    sql: *conflict-marker
    toml: *conflict-marker
    ini: *conflict-marker
    conf: *conflict-marker
    env: *conflict-marker
    make: *conflict-marker
    dockerfile: *conflict-marker
    nginx: *conflict-marker
    systemd: *conflict-marker
    tex: *conflict-marker
    nix: *conflict-marker
    hcl: *conflict-marker
    jinja: *conflict-marker
    workflow: *conflict-marker
- id: coding.dockerfile
  severity: medium
  summary: Dockerfile violates a hadolint check
  exclude:
    - "*.j2"
    - "*.jinja"
    - "*.jinja2"
  enforcer:
    dockerfile:
      tool: hadolint
