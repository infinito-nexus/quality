id: coding.structural/defer-in-loop
language: go
severity: warning
message: defer inside a loop runs only when the function returns
rule:
  kind: defer_statement
  inside:
    kind: for_statement
    stopBy:
      any:
        - kind: function_declaration
        - kind: method_declaration
        - kind: func_literal
---
id: test.text-presence/go
language: go
severity: warning
message: test only checks that a file contains text; parse, render or run it and assert on the result
utils:
  read-call:
    kind: call_expression
    has:
      field: function
      regex: '(?:^|\.)ReadFile$'
  reads:
    any:
      - matches: read-call
      - has:
          stopBy: end
          matches: read-call
  contains-call:
    kind: call_expression
    has:
      field: function
      regex: '^(?:strings|bytes)\.Contains(?:Any)?$|(?:^|\.)Match(?:String)?$'
  containment:
    any:
      - matches: contains-call
      - kind: unary_expression
        regex: '^!'
        has:
          field: operand
          matches: containment
      - kind: parenthesized_expression
        has:
          matches: containment
  fails:
    has:
      stopBy: end
      kind: call_expression
      has:
        field: function
        regex: '^\w+\.(?:Error|Errorf|Fatal|Fatalf|Fail|FailNow)$'
  other-check:
    any:
      - kind: if_statement
        has:
          field: consequence
          matches: fails
        not:
          has:
            field: condition
            any:
              - matches: containment
              - regex: '^\w*[eE]rr\w* != nil$'
      - kind: call_expression
        has:
          field: function
          regex: '^(?:assert|require)\.'
          not:
            regex: '^(?:assert|require)\.(?:Contains|NotContains|Regexp|NotRegexp|NoError)$'
  acts:
    kind: call_expression
    has:
      field: function
      regex: '(?i)(?:^|\.)\w*(?:unmarshal|decode|parse|execute|command|exec|write|create|tempdir|mkdirtemp|newserver|newrequest|newrecorder|render|template)\w*$'
  haystack:
    any:
      - pattern: string($H)
      - pattern: $H
  positive:
    any:
      - kind: if_statement
        all:
          - has:
              field: condition
              kind: unary_expression
              regex: '^!'
              has:
                field: operand
                matches: contains-call
                any:
                  - all:
                      - has:
                          field: function
                          regex: '^regexp\.Match(?:String)?$'
                      - has:
                          field: arguments
                          has:
                            nthChild: 2
                            matches: haystack
                  - not:
                      has:
                        field: function
                        regex: '^regexp\.Match(?:String)?$'
                    has:
                      field: arguments
                      has:
                        nthChild: 1
                        matches: haystack
          - has:
              field: consequence
              matches: fails
      - kind: call_expression
        all:
          - has:
              field: function
              regex: '^(?:assert|require)\.Contains$'
          - has:
              field: arguments
              has:
                nthChild: 2
                matches: haystack
      - kind: call_expression
        all:
          - has:
              field: function
              regex: '^(?:assert|require)\.Regexp$'
          - has:
              field: arguments
              has:
                nthChild: 3
                matches: haystack
  source:
    any:
      - any:
          - kind: short_var_declaration
          - kind: assignment_statement
        all:
          - has:
              field: left
              has:
                nthChild: 1
                pattern: $H
          - has:
              field: right
              matches: reads
      - kind: var_spec
        all:
          - has:
              field: name
              pattern: $H
          - has:
              field: value
              matches: reads
rule:
  kind: function_declaration
  all:
    - has:
        field: name
        regex: '^Test'
        pattern: $AT
    - has:
        field: parameters
        regex: '\*testing\.T\b'
    - not:
        has:
          stopBy: end
          matches: acts
    - not:
        has:
          stopBy: end
          matches: other-check
    - has:
        field: body
        any:
          - all:
              - has:
                  stopBy: end
                  matches: positive
              - has:
                  stopBy: end
                  matches: source
          - has:
              stopBy: end
              matches: positive
              has:
                stopBy: end
                matches: read-call
