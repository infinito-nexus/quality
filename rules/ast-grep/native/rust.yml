id: coding.structural/placeholder-macro
language: rust
severity: warning
message: todo, unimplemented or dbg macro left in code
rule:
  kind: macro_invocation
  has:
    field: macro
    regex: '^(?:todo|unimplemented|dbg)$'
---
id: clean.default-value/unwrap-or
language: rust
severity: warning
message: unwrap_or with a value; fail early, return an error that names the missing key and where to set it
rule:
  kind: field_identifier
  regex: '^unwrap_or(?:_default)?$'
  inside:
    kind: field_expression
    field: field
    inside:
      kind: call_expression
      field: function
      not:
        all:
          - has:
              field: function
              has:
                field: field
                regex: '^unwrap_or$'
          - has:
              field: arguments
              has:
                regex: '^\s*(?:""|''''|``|(?i:false|none|null|nil|undefined|string::new\(\)|vec::new\(\)|vec!\[\])|\[\s*\]|\{\s*\}|\(\s*\))?\s*$'
                all:
                  - nthChild: 1
                  - nthChild:
                      position: 1
                      reverse: true
---
id: clean.default-value/serde-default
language: rust
severity: warning
message: serde default; fail early, make the field required and deny unknown fields
rule:
  kind: attribute_item
  regex: '^#\[serde\([^\]]*\bdefault\b'
---
id: test.text-presence/rust
language: rust
severity: warning
message: test only checks that a file contains text; parse, render or run it and assert on the result
utils:
  read-call:
    any:
      - kind: macro_invocation
        has:
          field: macro
          regex: '^include_str$'
      - kind: call_expression
        has:
          field: function
          regex: '(?:^|::)(?:read_to_string|fs::read)$'
  reads:
    any:
      - matches: read-call
      - has:
          stopBy: end
          matches: read-call
  check-macro:
    kind: macro_invocation
    has:
      field: macro
      regex: '^(?:debug_)?assert(?:_eq|_ne)?$|^assert_matches$'
  containment-macro:
    kind: macro_invocation
    regex: '^(?:debug_)?assert!\s*\(\s*!?[^,;]*?\.contains\('
  other-check:
    matches: check-macro
    not:
      matches: containment-macro
  acts:
    any:
      - kind: call_expression
        has:
          field: function
          regex: '(?i)(?:^|::|\.)\w*(?:from_str|from_slice|from_reader|parse|command|write|create|temp|render|template|exec|spawn|load)\w*$'
      - kind: generic_function
        regex: '(?i)(?:^|::|\.)\w*(?:from_str|parse)\w*::'
  positive:
    any:
      - pattern: assert!($H.contains($$$))
      - pattern: assert!($H.contains($$$), $$$)
  direct:
    kind: macro_invocation
    regex: '^assert!\s*\(\s*(?:include_str!|(?:std::)?fs::read_to_string)[^;]*\.contains\('
  source:
    kind: let_declaration
    all:
      - has:
          field: pattern
          pattern: $H
      - has:
          field: value
          matches: reads
rule:
  kind: function_item
  all:
    - follows:
        stopBy:
          not:
            any:
              - kind: attribute_item
              - kind: line_comment
        kind: attribute_item
        regex: '^#\[(?:\w+::)*test\]$'
    - has:
        field: name
        pattern: $AT
    - not:
        has:
          stopBy: end
          matches: acts
    - not:
        has:
          stopBy: end
          matches: other-check
    - has:
        field: body
        any:
          - all:
              - has:
                  stopBy: end
                  matches: positive
              - has:
                  stopBy: end
                  matches: source
          - has:
              stopBy: end
              matches: direct
