id: coding.structural/pipe-to-shell
language: bash
severity: warning
message: a downloaded script is piped straight into a shell
rule:
  kind: pipeline
  all:
    - has:
        kind: command
        has:
          field: name
          regex: '^(?:curl|wget)$'
    - has:
        kind: command
        has:
          field: name
          regex: '^(?:ba|da|z|k)?sh$'
---
id: clean.default-value/expansion
language: bash
severity: warning
message: parameter expansion with a default; fail early with ${NAME:?set NAME in <where it is configured>}
rule:
  kind: expansion
  regex: '^\$\{(?:[A-Za-z_]\w*|\d+):?[-=]'
  not:
    regex: '^\$\{(?:[A-Za-z_]\w*|\d+):?[-=]\s*(?:""|''''|``|(?i:false|none|null|nil|undefined)|\[\s*\]|\{\s*\}|\(\s*\))?\s*\}$'
---
id: clean.default-value/embedded
language: bash
severity: warning
message: parameter expansion with a default in a script a shell runs; fail early with ${NAME:?set NAME in <where it is configured>}
rule:
  regex: '\$\{(?:[A-Za-z_]\w*|\d+):?[-=]'
  any:
    - kind: raw_string
      follows:
        kind: word
        regex: '^-[A-Za-z]*c[A-Za-z]*$'
      inside:
        kind: command
        has:
          regex: '^(?:[^=]*/)?(?:(?:ba|da|z|k|a|mk|ya|tc|c|fi)?sh|su|runuser)$'
        not:
          has:
            field: name
            regex: '^(?:[^=]*/)?(?:echo|printf|print|:)$'
    - kind: raw_string
      inside:
        kind: command
        has:
          field: name
          regex: '^(?:eval|trap)$'
    - kind: heredoc_body
      regex: '\A#![ \t]*(?:\S*/)?(?:env[ \t]+(?:-\S+[ \t]+)*)?(?:ba|da|z|k)?sh\s'
      follows:
        kind: heredoc_start
        regex: '[''"\\]'
metadata:
  rows: '(?m)^(?:[^#\n]|(?<=[^ \t\n])#)*?(?<!\\)\$\{(?:[A-Za-z_]\w*|\d+):?[-=](?!\s*(?:""|''''|``|(?i:false|none|null|nil|undefined)|\[\s*\]|\{\s*\}|\(\s*\))?\s*\})'
---
id: clean.default-value/escaped
language: bash
severity: warning
message: parameter expansion with a default in a script a heredoc writes; fail early with ${NAME:?set NAME in <where it is configured>}
rule:
  kind: heredoc_body
  all:
    - regex: '\A#![ \t]*(?:\S*/)?(?:env[ \t]+(?:-\S+[ \t]+)*)?(?:ba|da|z|k)?sh\s'
    - regex: '\\\$\{(?:[A-Za-z_]\w*|\d+):?[-=]'
  follows:
    kind: heredoc_start
    not:
      regex: '[''"\\]'
metadata:
  rows: '(?m)^(?:[^#\n]|(?<=[^ \t\n])#)*?(?<!\\)\\\$\{(?:[A-Za-z_]\w*|\d+):?[-=](?!\s*(?:""|''''|``|(?i:false|none|null|nil|undefined)|\[\s*\]|\{\s*\}|\(\s*\))?\s*\})'
---
id: test.text-presence/bash
language: bash
severity: warning
message: test only checks that a file contains text; parse, render or run it and assert on the result
utils:
  allowed:
    kind: command
    has:
      field: name
      regex: '^(?:[ef]?grep|cat|assertContains|assertNotContains|assertTrue|assertFalse|fail|echo|printf|true)$'
  reads:
    any:
      - kind: command
        has:
          field: name
          regex: '^(?:[ef]?grep|cat)$'
      - kind: file_redirect
        regex: '^<[^<]'
  positive:
    any:
      - kind: command
        all:
          - has:
              field: name
              regex: '^[ef]?grep$'
          - not:
              has:
                field: argument
                regex: '^-[A-Za-z]*[vLc]'
          - not:
              inside:
                stopBy: end
                any:
                  - kind: negated_command
                  - kind: if_statement
                  - kind: while_statement
                  - kind: list
                    regex: '&&\s*fail\b'
      - kind: command
        all:
          - has:
              field: name
              regex: '^assertContains$'
          - has:
              field: argument
              has:
                stopBy: end
                any:
                  - kind: simple_expansion
                  - kind: expansion
                  - matches: reads
rule:
  kind: function_definition
  all:
    - has:
        field: name
        regex: '^test'
        pattern: $AT
    - not:
        has:
          stopBy: end
          any:
            - kind: command
              not:
                matches: allowed
            - kind: test_command
            - kind: process_substitution
            - kind: file_redirect
              regex: '>'
              not:
                regex: '/dev/null$|>&\d$'
    - has:
        field: body
        all:
          - has:
              stopBy: end
              matches: reads
          - has:
              stopBy: end
              matches: positive
