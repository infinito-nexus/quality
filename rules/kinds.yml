extensions:
  .py: python
  .pyi: python
  .sh: shell
  .bash: shell
  .zsh: shell
  .js: javascript
  .mjs: javascript
  .cjs: javascript
  .jsx: javascript
  .ts: typescript
  .mts: typescript
  .cts: typescript
  .tsx: tsx
  .java: java
  .kt: kotlin
  .kts: kotlin
  .cs: csharp
  .rs: rust
  .go: go
  .rb: ruby
  .php: php
  .lua: lua
  .c: c
  .h: c
  .cpp: cpp
  .cc: cpp
  .hpp: cpp
  .yml: yaml
  .yaml: yaml
  .json: json
  .md: markdown
  .html: html
  .htm: html
  .css: css
  .sql: sql
  .toml: toml
  .xml: xml
  .nix: nix
  .tex: tex
  .tf: hcl
  .hcl: hcl
  .ini: ini
  .cfg: ini
  .conf: conf
  .env: env
  .mk: make
  .service: systemd
  .socket: systemd
  .timer: systemd
  .mount: systemd
  .j2: jinja
  .jinja: jinja
  .jinja2: jinja
shebangs:
  bash: shell
  sh: shell
  dash: shell
  zsh: shell
  ksh: shell
  python: python
  pypy: python
  node: javascript
  ruby: ruby
  php: php
  lua: lua
templates:
  - jinja
globs:
  workflow:
    - /.github/workflows/*.yml
    - /.github/workflows/*.yaml
  make:
    - Makefile
    - makefile
    - GNUmakefile
  env:
    - .env
    - .env.*
  nginx:
    - nginx.conf
    - "*.nginx.conf"
    - "**/nginx/**/*.conf"
    - "**/conf.d/*.conf"
names:
  dockerfile: [Dockerfile, Containerfile]
binary_names: [.DS_Store, Thumbs.db]
known_suffixes:
  code: [.jsx, .mts, .cts, .cs, .cc, .cxx, .hh, .hxx, .swift, .scala, .groovy, .gradle, .kts,
    .dart, .zig, .nim, .hs, .ml, .fs, .vb, .ex, .exs, .erl, .clj, .cljs, .elm, .coffee, .jl,
    .r, .pl, .pm, .zsh, .ksh, .fish, .ps1, .psm1, .bat, .cmd, .vue, .svelte]
  document: [.md, .markdown, .mdx, .rst, .txt, .adoc, .asciidoc, .org, .tex, .html, .htm,
    .xhtml, .pdf, .doc, .docx, .odt, .rtf, .patch, .diff, .yaml, .yml, .json, .jsonc, .toml,
    .xml, .ini, .cfg, .conf, .csv, .tsv, .sql, .properties, .env, .log, .lock, .css, .scss,
    .sass, .less, .dockerignore, .gitignore, .bak, .orig, .old, .swp]
  image: [.png, .jpg, .jpeg, .gif, .svg, .ico, .webp, .bmp, .tif, .tiff, .avif, .heic, .psd]
  binary: [.zip, .gz, .tgz, .tar, .bz2, .xz, .zst, .7z, .rar, .jar, .war, .exe, .dll, .so,
    .dylib, .a, .o, .bin, .class, .pyc, .whl, .deb, .rpm, .iso, .dmg, .wasm]
  template: [.template, .tmpl, .tpl, .in, .j2, .jinja, .jinja2, .erb, .hbs, .handlebars,
    .mustache, .ejs, .njk, .liquid, .twig, .gotmpl, .mako, .eex, .heex]
code:
  - python
  - shell
  - javascript
  - typescript
  - tsx
  - java
  - kotlin
  - csharp
  - rust
  - go
  - ruby
  - php
  - lua
  - c
  - cpp
comment_markers:
  shell: "#"
  ruby: "#"
  javascript: "//"
  typescript: "//"
  tsx: "//"
  java: "//"
  kotlin: "//"
  csharp: "//"
  rust: "//"
  go: "//"
  php: "//"
  c: "//"
  cpp: "//"
  lua: "--"
  workflow: "#"
  yaml: "#"
  toml: "#"
  make: "#"
  env: "#"
  conf: "#"
  ini: "#"
  nginx: "#"
  dockerfile: "#"
  systemd: "#"
  nix: "#"
  hcl: "#"
  sql: "--"
  tex: "%"
  css: "/*"
  html: "<!--"
