[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kvb-quality"
dynamic = ["version"]
description = "One language-agnostic quality gate for staged changes and whole repositories"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kevin Veen-Birkenbach", email = "kevin@veen.world" }]
license = "MIT"
license-files = ["LICENSE"]
urls = { Homepage = "https://github.com/infinito-nexus/quality" }

dependencies = ["PyYAML", "pathspec"]

[project.scripts]
quality = "quality.cli:main"

[tool.setuptools]
packages = ["quality", "quality.adapters", "quality.rules"]
include-package-data = false

[tool.setuptools.package-dir]
"" = "src"
"quality.rules" = "rules"

[tool.setuptools.package-data]
"quality.rules" = ["*.yml", "semgrep/*.yml", "ast-grep/*.yml", "ast-grep/*/*.yml"]

[tool.setuptools.dynamic]
version = { attr = "quality.__version__" }

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider -rs"
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["deep: runs the deep tier on the shared test bundle, which `quality db update` fetches"]
