<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Quality check{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
{% block head %}{% endblock %}
</head>
<body>
<header>
  <a class="brand" href="{{ url_for('pages.index') }}">Quality check</a>
  <nav>
    {% if user %}
    <a href="{{ url_for('pages.account') }}">{{ user.name }}</a>
    <a href="{{ url_for('pages.logout') }}">Log out</a>
    {% elif login_available %}
    <a href="{{ url_for('pages.login') }}">Log in</a>
    {% endif %}
  </nav>
</header>
<main>
{% block main %}{% endblock %}
</main>
<footer>
  <a href="{{ url_for('pages.legal', page='privacy') }}">Privacy</a>
  <a href="{{ url_for('pages.legal', page='terms') }}">Terms</a>
  <a href="{{ url_for('pages.notices') }}">Notices</a>
</footer>
</body>
</html>
