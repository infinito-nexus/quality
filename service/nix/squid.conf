http_port 3128
workers 1
pid_filename none
access_log none
cache_store_log none
cache_log stdio:/dev/stderr
logfile_rotate 0
netdb_filename none
coredump_dir /tmp
cache deny all
negative_dns_ttl 60 seconds
forwarded_for delete
via off
httpd_suppress_version_string on
shutdown_lifetime 1 second

acl ssl_port port 443
acl connect method CONNECT
acl internal dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12
acl internal dst 192.0.0.0/24 192.168.0.0/16 198.18.0.0/15 224.0.0.0/4 240.0.0.0/4
# Exception: no ::ffff:0:0/96, Squid compares IPv4 as mapped IPv6, so that range matches every IPv4 address; mapped internal targets hit the IPv4 ranges above
acl internal dst ::/128 ::1 fc00::/7 fe80::/10 ff00::/8

include /etc/squid/site.conf

http_access deny !connect
http_access deny !ssl_port
http_access deny internal
http_access deny own_address
http_access allow connect ssl_port
http_access deny all
